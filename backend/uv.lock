version = 1
revision = 1
requires-python = ">=3.11"

[options]
exclude-newer = "2026-10-23T00:00:00Z"

[[package]]
name = "agentgate-backend"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "fastapi" },
    { name = "langgraph" },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "uvicorn" },
]

[package.metadata]
requires-dist = [
    { name = "fastapi", specifier = ">=0.115.0" },
    { name = "langgraph", specifier = ">=0.2.34" },
    { name = "pydantic", specifier = ">=2.9.0" },
    { name = "pydantic-settings", specifier = ">=2.5.0" },
    { name = "uvicorn", specifier = ">=0.32.0" },
]
