[project]
name = "agentgate-backend"
version = "0.1.0"
description = "Autonomous SWE agent backend with LangGraph, MCP, E2B Sandbox, and HITL guardrails"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AgentGate Team", email = "dev@agentgate.io" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.34",
    "langchain-core>=0.3.10",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "psycopg[binary,pool]>=3.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "e2b-code-interpreter>=1.0.0",
    "mcp>=1.0.0",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
